name: Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'site.css', 'assets/fonts/**', 'docs/**', 'packaging/README.md', 'tools/**', 'Gemfile', 'Gemfile.lock', '.github/workflows/pages.yml']
  pull_request:
    paths: ['index.html', 'site.css', 'assets/fonts/**', 'docs/**', 'packaging/README.md', 'tools/**', 'Gemfile', 'Gemfile.lock', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check documentation links and build site
        run: |
          bundle exec ruby tools/build_docs.rb --check
          bundle exec ruby tools/build_docs.rb
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tmp/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
