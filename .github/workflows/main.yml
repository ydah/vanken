name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.3', '3.4', '4.0']
        include:
          - os: macos-latest
            ruby: '3.4'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: '4.0.16'
          bundler-cache: true
      - name: Check generated signatures
        run: |
          bundle exec rake rbs
          git diff --exit-code -- sig
          test -z "$(git ls-files --others --exclude-standard sig)"
      - run: bundle exec rake
      - run: gem build --strict vanken.gemspec

  windows-files:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          rubygems: '4.0.16'
          bundler-cache: true
      - name: Check file inspection and filtering
        run: bundle exec rspec spec/architecture spec/unit/display_filter spec/unit/cli_spec.rb spec/integration/document_spec.rb spec/integration/reassembly_filters_spec.rb
      - run: gem build --strict vanken.gemspec

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          rubygems: '4.0.16'
          bundler-cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb fonts-dejavu-core fonts-noto-cjk zenity
      - name: Native packet inspection smoke
        run: xvfb-run -a bundle exec ruby -Ilib script/native-smoke.rb
