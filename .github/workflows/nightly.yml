name: Nightly validation
on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'
permissions:
  contents: read

jobs:
  bench-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Benchmark one million packets
        run: bundle exec ruby --yjit script/benchmark.rb 1000000 120 4 | tee benchmark.jsonl
      - name: Compare VDF and cBPF
        run: bundle exec ruby --yjit script/filter-performance.rb 20000 | tee filter-performance.json
      - name: Measure filtered I/O graphs
        run: bundle exec ruby --yjit script/analysis-performance.rb | tee analysis-performance.json
      - name: Fuzz display filters
        run: bundle exec ruby script/fuzz.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark.jsonl
            filter-performance.json
            analysis-performance.json
