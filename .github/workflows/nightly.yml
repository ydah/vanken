name: Nightly validation
on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'
permissions:
  contents: read

jobs:
  bench-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec ruby --yjit script/benchmark.rb 1000000 120 4
      - run: bundle exec ruby script/fuzz.rb
